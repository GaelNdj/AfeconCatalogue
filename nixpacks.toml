# Nixpacks often ignores railway.toml and runs `npm run build` only.
# That must install backend (express) AND frontend (vite).
[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm run install:all"]

[phases.build]
cmds = ["node scripts/log-frontend-build.js", "npm run build --prefix frontend"]

[start]
cmd = "npm start"
